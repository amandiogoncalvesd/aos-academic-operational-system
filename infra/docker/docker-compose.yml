# AOS — ambiente de desenvolvimento
# uso: docker compose -f infra/docker/docker-compose.yml up -d
name: aos
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aos
      POSTGRES_PASSWORD: aos
      POSTGRES_DB: aos
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U aos"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }

  kafka:
    image: bitnami/kafka:3.7
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    profiles: ["kafka"]

  clickhouse:
    image: clickhouse/clickhouse-server:24
    ports: ["8123:8123", "9000:9000"]
    profiles: ["analytics"]

  core:
    build: { context: ../../services/core }
    env_file: ../../.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://aos:aos@postgres:5432/aos
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EVENT_BUS_BACKEND: redis
      PLUGINS_DIR: /plugins
    volumes:
      - ../../services/core:/app
      - ../../plugins:/plugins
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    image: node:20-alpine
    working_dir: /repo
    volumes: ["../..:/repo"]
    environment: { NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1 }
    command: sh -c "corepack enable && pnpm install && pnpm --filter @aos/web dev -- -H 0.0.0.0"
    ports: ["3000:3000"]
    depends_on: [core]
    profiles: ["web"]

volumes:
  pgdata:
